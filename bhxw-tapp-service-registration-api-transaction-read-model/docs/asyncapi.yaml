asyncapi: 3.1.0
id: urn:bns:tapp:transaction-projection
info:
  title: TAPP Transaction Projection Events
  version: 1.0.0-draft
  description: "Contrato asíncrono para publicar y consumir eventos que actualizan el\nTransaction Read Model en\
    \ PostgreSQL.\n\nConvenciones aplicadas:\n  - Todas las propiedades del mensaje usan snake_case.\n  - El cuerpo\
    \ del mensaje contiene únicamente payload y metadata.\n  - payload contiene directamente la proyección consolidada\
    \ de la transacción.\n  - metadata.event_id se utiliza para idempotencia.\n  - payload.aggregate_version se\
    \ utiliza para controlar el orden.\n  - La clave Kafka se construye como transaction_id + \"|\" + req_msg_id.\n"
defaultContentType: application/json
servers:
  event_bus:
    host: kafka.tapp.com:9092
    protocol: kafka
    description: Bootstrap server referencial. Reemplazar por el host real.
channels:
  transaction_projection:
    address: tapp.transaction.projection.v1
    description: Tópico principal de eventos para proyección.
    messages:
      transaction_projection_message:
        $ref: '#/components/messages/transaction_projection_message'
  transaction_projection_retry:
    address: tapp.transaction.projection.v1.retry
    description: Tópico propuesto para reintentos por errores transitorios.
    messages:
      transaction_projection_retry_message:
        $ref: '#/components/messages/transaction_projection_message'
  transaction_projection_dlq:
    address: tapp.transaction.projection.v1.dlq
    description: Dead Letter Queue de eventos inválidos o con reintentos agotados.
    messages:
      transaction_projection_dlq_message:
        $ref: '#/components/messages/transaction_projection_dlq_message'
operations:
  publish_transaction_projection:
    action: send
    title: Publicar evento de proyección
    summary: Outbox Publisher Service publica el evento en Kafka.
    channel:
      $ref: '#/channels/transaction_projection'
    messages:
    - $ref: '#/channels/transaction_projection/messages/transaction_projection_message'
  consume_transaction_projection:
    action: receive
    title: Consumir evento de proyección
    summary: Transaction Projection Service escucha continuamente el tópico.
    description: 'El consumidor valida el mensaje, controla idempotencia y orden,

      y ejecuta el upsert atómico sobre PostgreSQL. El offset se confirma

      después de aplicar o ignorar correctamente el evento.

      '
    channel:
      $ref: '#/channels/transaction_projection'
    messages:
    - $ref: '#/channels/transaction_projection/messages/transaction_projection_message'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
          - transaction_projection_service_v1
        clientId:
          type: string
          pattern: ^transaction_projection_service_[A-Za-z0-9._-]+$
        bindingVersion: 0.5.0
  consume_transaction_projection_retry:
    action: receive
    title: Reintentar evento de proyección
    channel:
      $ref: '#/channels/transaction_projection_retry'
    messages:
    - $ref: '#/channels/transaction_projection_retry/messages/transaction_projection_retry_message'
  publish_transaction_projection_dlq:
    action: send
    title: Publicar evento fallido en DLQ
    channel:
      $ref: '#/channels/transaction_projection_dlq'
    messages:
    - $ref: '#/channels/transaction_projection_dlq/messages/transaction_projection_dlq_message'
components:
  messages:
    transaction_projection_message:
      name: transaction_projection_event
      title: Transaction Projection Event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/transaction_projection_event'
      bindings:
        kafka:
          key:
            type: string
            description: Clave formada por transaction_id + "|" + req_msg_id.
            pattern: ^[A-Za-z0-9._:-]+\|[A-Za-z0-9._:-]+$
            example: TXN-001|ABC-001
          bindingVersion: 0.5.0
      examples:
      - name: log_audit_delivered
        summary: Proyección completa de una transacción finalizada
        payload:
          payload:
            transaction_id: TXN-001
            req_msg_id: ABC-001
            event_type: LogAuditDelivered
            aggregate_version: 9
            occurred_at: '2026-01-01T10:05:00Z'
            transaction_status: COMPLETED
            callback_status: DELIVERED
            notification_status: DELIVERED
            log_audit_status: PERSISTED
            amount: '100.00'
            currency: PEN
            masked_account: '****3456'
            started_at: '2026-01-01T10:00:00Z'
            completed_at: '2026-01-01T10:05:00Z'
            events:
            - event_id: EVT-000001
              event_type: DebitRequested
              aggregate_version: 1
              occurred_at: '2026-01-01T10:00:00Z'
            - event_id: EVT-000009
              event_type: LogAuditDelivered
              aggregate_version: 9
              occurred_at: '2026-01-01T10:05:00Z'
          metadata:
            event_id: EVT-000009
            schema_version: '1.0'
            published_at: '2026-01-01T10:05:01Z'
            source_service: outbox_publisher_service
            correlation_id: 5c52ed8c-b527-4e0e-b934-43aaf31eed05
            trace_id: 44af23d858bb4f18
            retry_count: 0
    transaction_projection_dlq_message:
      name: transaction_projection_dlq_event
      title: Transaction Projection DLQ Event
      contentType: application/json
      payload:
        $ref: '#/components/schemas/transaction_projection_dlq_event'
      bindings:
        kafka:
          key:
            type: string
            description: Misma clave Kafka del evento original.
            pattern: ^[A-Za-z0-9._:-]+\|[A-Za-z0-9._:-]+$
            example: TXN-001|ABC-001
          bindingVersion: 0.5.0
  schemas:
    transaction_projection_event:
      type: object
      additionalProperties: false
      required:
      - payload
      - metadata
      properties:
        payload:
          $ref: '#/components/schemas/transaction_projection_payload'
        metadata:
          $ref: '#/components/schemas/event_metadata'
    transaction_projection_payload:
      type: object
      additionalProperties: false
      required:
      - transaction_id
      - req_msg_id
      - event_type
      - aggregate_version
      - occurred_at
      - transaction_status
      - callback_status
      - notification_status
      - log_audit_status
      - started_at
      properties:
        transaction_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9._:-]+$
          description: Identificador único de la transacción.
        req_msg_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9._:-]+$
          description: Identificador del mensaje de solicitud original.
        event_type:
          $ref: '#/components/schemas/event_type'
        aggregate_version:
          type: integer
          format: int64
          minimum: 1
          description: Secuencia monótonamente creciente de la transacción.
        occurred_at:
          type: string
          format: date-time
          description: Fecha y hora del evento de negocio.
        transaction_status:
          type: string
          enum:
          - RECEIVED
          - PROCESSING
          - COMPLETED
          - FAILED
          - REJECTED
        callback_status:
          $ref: '#/components/schemas/delivery_status'
        notification_status:
          $ref: '#/components/schemas/delivery_status'
        log_audit_status:
          type: string
          enum:
          - NOT_REQUESTED
          - PENDING
          - PERSISTED
          - FAILED
        amount:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,4})?$
          description: Decimal como texto para evitar pérdida de precisión.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          pattern: ^[A-Z]{3}$
        account_reference:
          type: string
          maxLength: 200
          description: Referencia cifrada o tokenizada de la cuenta.
        masked_account:
          type: string
          maxLength: 50
        started_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        events:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/projection_event_summary'
    event_metadata:
      type: object
      additionalProperties: false
      required:
      - event_id
      - schema_version
      - published_at
      - source_service
      - correlation_id
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 45
          description: Identificador único del evento para idempotencia.
        schema_version:
          type: string
          minLength: 1
          maxLength: 10
          pattern: ^\d+\.\d+$
        published_at:
          type: string
          format: date-time
        source_service:
          type: string
          minLength: 1
          maxLength: 100
        correlation_id:
          type: string
          minLength: 1
          maxLength: 100
        trace_id:
          type: string
          minLength: 1
          maxLength: 100
        payload_signature:
          type: string
          minLength: 1
          maxLength: 4096
        key_id:
          type: string
          minLength: 1
          maxLength: 100
        retry_count:
          type: integer
          minimum: 0
          maximum: 3
          default: 0
    projection_event_summary:
      type: object
      additionalProperties: false
      required:
      - event_id
      - event_type
      - aggregate_version
      - occurred_at
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 45
        event_type:
          $ref: '#/components/schemas/event_type'
        aggregate_version:
          type: integer
          format: int64
          minimum: 1
        occurred_at:
          type: string
          format: date-time
    delivery_status:
      type: string
      enum:
      - NOT_REQUESTED
      - PENDING
      - DELIVERED
      - FAILED
    event_type:
      type: string
      description: Catálogo inicial; validar con el Event Store definitivo.
      enum:
      - DebitRequested
      - ValidationPassed
      - DebitExecuted
      - CallbackRequested
      - CallbackDelivered
      - NotificationRequested
      - NotificationDelivered
      - LogAuditRequested
      - LogAuditDelivered
    transaction_projection_dlq_event:
      type: object
      additionalProperties: false
      required:
      - payload
      - metadata
      properties:
        payload:
          $ref: '#/components/schemas/transaction_projection_payload'
        metadata:
          $ref: '#/components/schemas/dead_letter_metadata'
    dead_letter_metadata:
      allOf:
      - $ref: '#/components/schemas/event_metadata'
      - type: object
        required:
        - error_code
        - error_type
        - error_message
        - maximum_retries
        - first_failed_at
        - last_failed_at
        - failed_by
        - original_topic
        - original_partition
        - original_offset
        - consumer_group
        properties:
          error_code:
            type: string
            minLength: 1
            maxLength: 50
          error_type:
            type: string
            enum:
            - NON_RETRYABLE
            - RETRYABLE_EXHAUSTED
          error_message:
            type: string
            minLength: 1
            maxLength: 1000
          maximum_retries:
            type: integer
            minimum: 0
            maximum: 3
          first_failed_at:
            type: string
            format: date-time
          last_failed_at:
            type: string
            format: date-time
          failed_by:
            type: string
            minLength: 1
            maxLength: 100
          original_topic:
            type: string
            minLength: 1
            maxLength: 249
          original_partition:
            type: integer
            minimum: 0
          original_offset:
            type: integer
            format: int64
            minimum: 0
          consumer_group:
            type: string
            minLength: 1
            maxLength: 255

