openapi: 3.1.0
info:
  title: Accounts API
  version: 1.0.0-draft
  description: Consultas de cuentas y saldos para TAPP, JOY, TBK y nuevos canales.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
x-contract-scope: INTERNAL_DRAFT_NOT_NIUBIZ
servers:
  - url: https://api-dev.example.bank/accounts
    description: URL referencial de desarrollo
tags:
  - name: Accounts
    description: Listado, detalle y consulta de saldos de cuentas.
paths:
  /v1/customers/{customer_id}/accounts:
    get:
      tags: [Accounts]
      operationId: listCustomerAccounts
      summary: Listar cuentas de un cliente
      description: >-
        Lee el Account Read Model. B121 es la referencia de BCS; WJ24/JN24
        aparecen como operaciones subyacentes y deben confirmarse por producto.
      x-core-transactions: [B121, WJ24, JN24]
      security:
        - siaOAuth2: [account.read]
          apiKeyAuth: []
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
      responses:
        '200':
          description: Lista de cuentas; puede estar vacía
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
              examples:
                one_account:
                  value:
                    data:
                      - account_id: ACC-100045
                        masked_number: '******3456'
                        type: SAVINGS
                        currency: PEN
                        status: ACTIVE
                        alias: Cuenta sueldo
                        last_updated_at: '2026-08-25T15:30:00Z'
                    meta:
                      correlation_id: 80a71e5a-61c1-4f72-84f8-57d83f4d1672
                      page_size: 50
                      next_cursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CustomerNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/accounts/{account_id}:
    get:
      tags: [Accounts]
      operationId: getAccountDetail
      summary: Consultar detalle de una cuenta
      x-core-transactions: [B620]
      security:
        - siaOAuth2: [account.read]
          apiKeyAuth: []
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Detalle de cuenta encontrado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/accounts/{account_id}/balance:
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Consultar saldo de una cuenta
      description: Consulta de saldo con referencia funcional WJ12.
      x-core-transactions: [WJ12]
      security:
        - siaOAuth2: [account.balance.read]
          apiKeyAuth: []
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Saldo consultado correctamente
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              examples:
                pen_balance:
                  value:
                    data:
                      account_id: ACC-100045
                      currency: PEN
                      ledger_balance: '1250.50'
                      available_balance: '1100.50'
                      as_of: '2026-08-25T15:30:00Z'
                    meta:
                      correlation_id: 80a71e5a-61c1-4f72-84f8-57d83f4d1672
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/CoreError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key emitida y validada por Apigee para el canal autorizado.
    mutualTLS:
      type: mutualTLS
      description: Certificado cliente validado en las capas Akamai/Apigee.
    siaOAuth2:
      type: oauth2
      description: Integración OAuth 2.0 con Secure Integrated Authentication (SIA).
      flows:
        clientCredentials:
          tokenUrl: https://sia.example.bank/oauth2/token
          scopes:
            account.read: Consultar cuentas
            account.balance.read: Consultar saldos
  parameters:
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
    AccountId:
      name: account_id
      in: path
      required: true
      description: Identificador interno o token de cuenta; nunca el número completo.
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: X-Channel-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 30
        pattern: '^[A-Z0-9_-]+$'
        examples: [TAPP, JOY, TBK, NEW_FLOW]
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 500 }
  headers:
    CorrelationId:
      description: Identificador de trazabilidad recibido en la solicitud.
      schema: { type: string, format: uuid }
  schemas:
    AccountListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AccountSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    AccountDetailResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AccountDetail' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    BalanceResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Balance' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AccountSummary:
      type: object
      additionalProperties: false
      required: [account_id, masked_number, type, currency, status, last_updated_at]
      properties:
        account_id: { type: string, maxLength: 64 }
        masked_number: { type: string, minLength: 4, maxLength: 32 }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        alias: { type: string, maxLength: 80 }
        last_updated_at: { type: string, format: date-time }
    AccountDetail:
      allOf:
        - $ref: '#/components/schemas/AccountSummary'
        - type: object
          additionalProperties: false
          required: [customer_id, product_code]
          properties:
            customer_id: { type: string, maxLength: 64 }
            product_code: { type: string, maxLength: 30 }
            branch_code: { type: string, maxLength: 20 }
            opened_at: { type: string, format: date }
    Balance:
      type: object
      additionalProperties: false
      required: [account_id, currency, ledger_balance, available_balance, as_of]
      properties:
        account_id: { type: string, maxLength: 64 }
        currency: { $ref: '#/components/schemas/Currency' }
        ledger_balance: { $ref: '#/components/schemas/DecimalAmount' }
        available_balance: { $ref: '#/components/schemas/DecimalAmount' }
        as_of: { type: string, format: date-time }
    AccountType:
      type: string
      enum: [SAVINGS, CHECKING, SALARY, CREDIT, OTHER]
    AccountStatus:
      type: string
      enum: [ACTIVE, DORMANT, BLOCKED, CLOSED, UNKNOWN]
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [PEN, USD]
    DecimalAmount:
      type: string
      pattern: '^-?[0-9]{1,16}(\.[0-9]{1,4})?$'
      examples: ['1250.50']
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [correlation_id]
      properties:
        correlation_id: { type: string, format: uuid }
    PageMeta:
      type: object
      additionalProperties: false
      required: [correlation_id, page_size]
      properties:
        correlation_id: { type: string, format: uuid }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        next_cursor: { type: [string, 'null'], maxLength: 500 }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, maxLength: 80 }
        detail: { type: string, maxLength: 1000 }
        instance: { type: string, maxLength: 200 }
        correlation_id: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Solicitud inválida
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Credenciales ausentes o inválidas
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: El consumidor no posee el alcance requerido
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CustomerNotFound:
      description: Cliente no encontrado
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    AccountNotFound:
      description: Cuenta no encontrada
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Límite de solicitudes excedido
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CoreError:
      description: El core respondió con error o una respuesta no válida
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InternalError:
      description: Error interno no esperado
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ServiceUnavailable:
      description: Servicio o dependencia temporalmente no disponible
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
