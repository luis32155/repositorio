openapi: 3.1.0
info:
  title: Debit Payments API
  version: 1.0.0-draft
  description: Ejecución idempotente de débitos TP02 y reversas TP04.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
x-contract-scope: INTERNAL_DRAFT_NOT_NIUBIZ
servers:
  - url: https://api-dev.example.bank/debit-payments
    description: URL referencial de desarrollo
tags:
  - name: Debit Payments
    description: Operaciones monetarias de débito y reversa.
paths:
  /v1/debit-transactions:
    post:
      tags: [Debit Payments]
      operationId: createDebitTransaction
      summary: Ejecutar una operación de débito
      x-core-transactions: [TP02]
      security:
        - siaOAuth2: [debit.write]
          apiKeyAuth: []
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebitRequest' }
            examples:
              debit_pen:
                value:
                  customer_id: CUS-100045
                  account_id: ACC-100045
                  amount:
                    value: '100.00'
                    currency: PEN
                  description: Pago de servicio
                  external_reference: ORDER-20260825-001
      responses:
        '201':
          description: Débito registrado
          headers:
            Location:
              description: URI relativa de la transacción creada.
              schema: { type: string }
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/BusinessRejection' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/CoreError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/debit-transactions/{transaction_id}/reversals:
    post:
      tags: [Debit Payments]
      operationId: reverseDebitTransaction
      summary: Reversar una operación de débito
      description: >-
        Propone reversa total. La reversa parcial y la ventana máxima deben acordarse
        con el core antes de aprobar la versión 1.0.
      x-core-transactions: [TP04]
      security:
        - siaOAuth2: [debit.reverse]
          apiKeyAuth: []
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReversalRequest' }
            examples:
              customer_request:
                value:
                  reason_code: CUSTOMER_REQUEST
                  description: Solicitud de anulación del cliente
                  external_reference: REV-20260825-001
      responses:
        '201':
          description: Reversa registrada
          headers:
            Location:
              description: URI relativa de la reversa creada.
              schema: { type: string }
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Idempotency-Key:
              $ref: '#/components/headers/IdempotencyKey'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReversalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TransactionNotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/BusinessRejection' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/CoreError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key emitida y validada por Apigee para el canal autorizado.
    mutualTLS:
      type: mutualTLS
      description: Certificado cliente validado en las capas Akamai/Apigee.
    siaOAuth2:
      type: oauth2
      description: Integración OAuth 2.0 con Secure Integrated Authentication (SIA).
      flows:
        clientCredentials:
          tokenUrl: https://sia.example.bank/oauth2/token
          scopes:
            debit.write: Ejecutar débitos
            debit.reverse: Reversar débitos
  parameters:
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: X-Channel-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 30
        pattern: '^[A-Z0-9_-]+$'
        examples: [TAPP, JOY, TBK, NEW_FLOW]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Misma clave y mismo cuerpo devuelven el resultado original; la misma clave
        con otro cuerpo responde 409.
      schema: { type: string, minLength: 16, maxLength: 100, pattern: '^[A-Za-z0-9._:-]+$' }
  headers:
    CorrelationId:
      description: Identificador de trazabilidad recibido en la solicitud.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      description: Clave de idempotencia recibida en la solicitud.
      schema: { type: string, minLength: 16, maxLength: 100 }
  schemas:
    DebitRequest:
      type: object
      additionalProperties: false
      required: [customer_id, account_id, amount, external_reference]
      properties:
        customer_id: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
        account_id: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string, maxLength: 140 }
        external_reference: { type: string, minLength: 1, maxLength: 100 }
    ReversalRequest:
      type: object
      additionalProperties: false
      required: [reason_code, external_reference]
      properties:
        reason_code:
          type: string
          enum: [CUSTOMER_REQUEST, DUPLICATE, TECHNICAL_ERROR, FRAUD, OTHER]
        description: { type: string, maxLength: 300 }
        external_reference: { type: string, minLength: 1, maxLength: 100 }
    TransactionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PaymentTransaction' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ReversalResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Reversal' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    PaymentTransaction:
      type: object
      additionalProperties: false
      required: [transaction_id, type, status, amount, created_at]
      properties:
        transaction_id: { type: string, maxLength: 100 }
        type: { type: string, const: DEBIT }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        amount: { $ref: '#/components/schemas/Money' }
        core_reference: { type: string, maxLength: 100 }
        rejection_code: { type: string, maxLength: 80 }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    Reversal:
      type: object
      additionalProperties: false
      required: [reversal_id, original_transaction_id, status, created_at]
      properties:
        reversal_id: { type: string, maxLength: 100 }
        original_transaction_id: { type: string, maxLength: 100 }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        core_reference: { type: string, maxLength: 100 }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    Money:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          type: string
          pattern: '^[0-9]{1,16}(\.[0-9]{1,4})?$'
          examples: ['100.00']
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [PEN, USD]
    TransactionStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, FAILED, REVERSED]
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [correlation_id]
      properties:
        correlation_id: { type: string, format: uuid }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, maxLength: 80 }
        detail: { type: string, maxLength: 1000 }
        instance: { type: string, maxLength: 200 }
        correlation_id: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Solicitud inválida
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Credenciales ausentes o inválidas
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: El consumidor no posee el alcance requerido
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    AccountNotFound:
      description: Cuenta no encontrada
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TransactionNotFound:
      description: Transacción original no encontrada
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    IdempotencyConflict:
      description: Clave de idempotencia reutilizada con un cuerpo diferente
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    BusinessRejection:
      description: Operación rechazada por una regla de negocio o por el core
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Límite de solicitudes excedido
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CoreError:
      description: El core respondió con error o una respuesta no válida
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InternalError:
      description: Error interno no esperado
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ServiceUnavailable:
      description: Servicio o dependencia temporalmente no disponible
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
