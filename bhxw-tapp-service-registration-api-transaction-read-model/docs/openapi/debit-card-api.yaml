openapi: 3.1.0
info:
  title: Debit Card API
  version: 1.0.0-draft
  description: Validación segura de tarjetas de débito mediante la operación TP08.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
x-contract-scope: INTERNAL_DRAFT_NOT_NIUBIZ
servers:
  - url: https://api-dev.example.bank/debit-cards
    description: URL referencial de desarrollo
tags:
  - name: Debit Cards
    description: Validación segura de estado y pertenencia de tarjetas de débito.
paths:
  /v1/debit-cards/validations:
    post:
      tags: [Debit Cards]
      operationId: validateDebitCard
      summary: Validar una tarjeta de débito
      description: >-
        Valida existencia, estado y relación con el cliente. El contrato acepta
        únicamente un token de tarjeta; PAN y CVV no deben enviarse ni registrarse.
      x-core-transactions: [TP08]
      security:
        - siaOAuth2: [card.verify]
          apiKeyAuth: []
          mutualTLS: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardValidationRequest'
            examples:
              active_card:
                value:
                  customer_id: CUS-100045
                  card_token: tok_card_F4x9z8
                  account_id: ACC-100045
      responses:
        '200':
          description: Validación ejecutada; `valid` contiene el resultado de negocio
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardValidationResponse'
              examples:
                valid:
                  value:
                    data:
                      validation_id: VAL-940104
                      valid: true
                      reason_code: VALID
                      card_status: ACTIVE
                      last_four: '1234'
                      validated_at: '2026-08-25T15:30:00Z'
                    meta:
                      correlation_id: 80a71e5a-61c1-4f72-84f8-57d83f4d1672
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CardNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/CoreError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key emitida y validada por Apigee para el canal autorizado.
    mutualTLS:
      type: mutualTLS
      description: Certificado cliente validado en las capas Akamai/Apigee.
    siaOAuth2:
      type: oauth2
      description: Integración OAuth 2.0 con Secure Integrated Authentication (SIA).
      flows:
        clientCredentials:
          tokenUrl: https://sia.example.bank/oauth2/token
          scopes:
            card.verify: Validar tarjetas de débito
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    ChannelId:
      name: X-Channel-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 30
        pattern: '^[A-Z0-9_-]+$'
        examples: [TAPP, JOY, TBK, NEW_FLOW]
  headers:
    CorrelationId:
      description: Identificador de trazabilidad recibido en la solicitud.
      schema: { type: string, format: uuid }
  schemas:
    CardValidationRequest:
      type: object
      additionalProperties: false
      required: [customer_id, card_token]
      properties:
        customer_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
        card_token:
          type: string
          minLength: 10
          maxLength: 256
          description: Token opaco emitido por el proveedor autorizado de tokenización.
        account_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._:-]+$'
    CardValidationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CardValidation' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    CardValidation:
      type: object
      additionalProperties: false
      required: [validation_id, valid, reason_code, validated_at]
      properties:
        validation_id: { type: string, minLength: 1, maxLength: 64 }
        valid: { type: boolean }
        reason_code:
          type: string
          enum: [VALID, INACTIVE, BLOCKED, EXPIRED, CUSTOMER_MISMATCH, ACCOUNT_MISMATCH, UNKNOWN]
        card_status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED, EXPIRED, UNKNOWN]
        last_four:
          type: string
          pattern: '^[0-9]{4}$'
        validated_at: { type: string, format: date-time }
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [correlation_id]
      properties:
        correlation_id: { type: string, format: uuid }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, maxLength: 80 }
        detail: { type: string, maxLength: 1000 }
        instance: { type: string, maxLength: 200 }
        correlation_id: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Solicitud inválida
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Credenciales ausentes o inválidas
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: El consumidor no posee el alcance requerido
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CardNotFound:
      description: Token de tarjeta no encontrado
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Límite de solicitudes excedido
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CoreError:
      description: El core respondió con error o una respuesta no válida
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InternalError:
      description: Error interno no esperado
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ServiceUnavailable:
      description: Servicio o dependencia temporalmente no disponible
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
