services:
  postgres:
    image: postgres:18-alpine
    container_name: customer-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: customer_event_consumer
      POSTGRES_USER: customer_consumer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_customer_password}
    volumes:
      - customer_postgres_data:/var/lib/postgresql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U customer_consumer -d customer_event_consumer
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    container_name: customer-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list
      interval: 5s
      timeout: 10s
      retries: 24

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: customer-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:29092
      --create --if-not-exists
      --topic bhxw.tapp.customer.cdc.v1
      --partitions 3
      --replication-factor 1

  customer-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-event-consumer
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/customer_event_consumer
      POSTGRES_USER: customer_consumer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_customer_password}
      DB_INIT_MODE: always
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_CUSTOMER_EVENTS: bhxw.tapp.customer.cdc.v1
      KAFKA_CONSUMER_GROUP: customer_event_consumer_local_v1
      KAFKA_CONCURRENCY: 1
      VIRTUAL_THREADS_ENABLED: "true"
      LOG_FORMAT_CONSOLE: ecs
    restart: unless-stopped

volumes:
  customer_postgres_data:
