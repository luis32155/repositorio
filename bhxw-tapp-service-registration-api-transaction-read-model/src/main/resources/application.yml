spring:
  application:
    name: bhxw-tapp-service-registration-api
  webflux:
    base-path: /
  r2dbc:
    url: ${POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5432/tapp_transaction_read_model}
    username: ${POSTGRES_USER:tapp_projection}
    password: ${POSTGRES_PASSWORD:local_projection_password}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
  sql:
    init:
      mode: ${DB_INIT_MODE:never}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:transaction_projection_service_v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: pe.com.scotiabank.tapp.service.registration.api.domain.model.TransactionProjectionEvent
        spring.json.trusted.packages: pe.com.scotiabank.tapp.service.registration.api.domain.model
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    listener:
      ack-mode: record
      missing-topics-fatal: true

app:
  kafka:
    consumer-group: ${KAFKA_CONSUMER_GROUP:transaction_projection_service_v1}
    topics:
      transaction-projection: ${KAFKA_TOPIC_TRANSACTION_PROJECTION:tapp.transaction.projection.v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  level:
    root: INFO
    pe.com.scotiabank.tapp.service.registration.api: INFO
