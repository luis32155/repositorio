services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: local_admin
      MONGO_INITDB_ROOT_PASSWORD: local_mongo_password
      MONGO_INITDB_DATABASE: customer_event_consumer
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - local_admin
        - --password
        - local_mongo_password
        - --authenticationDatabase
        - admin
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongo_data:

